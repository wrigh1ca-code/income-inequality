name: Monthly data refresh

on:
  schedule:
    - cron: "17 15 3 * *"   # 3rd of every month, 15:17 UTC
  workflow_dispatch: {}      # also runnable from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Federal Reserve data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No new data this month."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "Monthly data refresh: Federal Reserve wealth data ($(date -u +'%B %Y'))"
          git push
